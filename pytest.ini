[pytest]
pythonpath = .
markers =
    hermetic: mocked unit tests that need no live bridge and must never trigger the /stop teardown
    units(n): number of live spawn-and-turn units a story spends (FR-7 budget; counted into the baseline file)
    group(letter): TestPRD section 4 group of a story or class (A..J); a module-level GROUP = "X" is the fallback
